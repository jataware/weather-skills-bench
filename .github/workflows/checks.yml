name: Check benchmark
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check out pinned skill catalog
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import subprocess
          pin = json.loads(Path('catalog.lock.json').read_text())
          catalog = Path.cwd().parent / 'weather-skills-catalog'
          subprocess.run(['git', 'clone', '--no-checkout',
                          'https://github.com/weather-skills/weather-skills-catalog.git',
                          str(catalog)], check=True)
          subprocess.run(['git', '-C', str(catalog), 'checkout', '--detach',
                          pin['catalog_commit']], check=True)
          PY
      - run: pip install -r requirements.lock
      - name: Verify catalog pin
        run: python -c "from weather_bench.catalog import verify; verify()"
      - run: python -m pytest -q
      - run: node --check docs/app.js
